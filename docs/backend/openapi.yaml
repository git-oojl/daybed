        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Último ingreso
      required:
      - date_joined
      - email
      - id
      - is_staff
      - is_superuser
      - last_login
      - username
