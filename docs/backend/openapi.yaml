          type: integer
          readOnly: true
        product_name:
          type: string
          readOnly: true
        movement_type:
          allOf:
          - $ref: '#/components/schemas/MovementTypeEnum'
          readOnly: true
        quantity_delta:
          type: integer
          readOnly: true
        previous_stock:
          type: integer
          readOnly: true
        new_stock:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
          nullable: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_by_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
