components:
  schemas:
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - subtotal
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - line_total
      - product
      - quantity
      - updated_at
    CartItemQuantity:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
      required:
      - quantity
    CartItemWrite:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Checkout:
      type: object
      properties:
        original_address:
          type: string
          maxLength: 500
        formatted_address:
          type: string
          maxLength: 500
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        estimated_duration_minutes:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,1})?$
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        delivery_zone:
          type: string
          default: standard
          maxLength: 80
        geocoding_provider:
          type: string
          maxLength: 80
        distance_provider:
          type: string
          maxLength: 80
      required:
      - delivery_fee
      - distance_km
      - estimated_duration_minutes
      - formatted_address
      - latitude
      - longitude
      - original_address
    CustomerRegistration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: Obligatorio. Longitud máxima 150 caracteres alfanuméricos.
            Letras, dígitos y @/./+/-/_ únicamente.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        confirmPassword:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellido
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        state:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        nombre:
          type: string
          writeOnly: true
        apellido:
          type: string
          writeOnly: true
        telefono:
          type: string
          writeOnly: true
        estado:
          type: string
          writeOnly: true
        ciudad:
          type: string
          writeOnly: true
        role:
          type: string
          readOnly: true
      required:
      - email
      - id
      - password
      - role
    DashboardMetrics:
      type: object
      properties:
        total_orders:
          type: integer
        total_simulated_sales:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        orders_by_status:
          type: array
          items:
            $ref: '#/components/schemas/OrdersByStatus'
        low_stock_count:
          type: integer
        recent_orders:
          type: array
          items:
            $ref: '#/components/schemas/RecentOrder'
        average_delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        average_delivery_distance:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
      required:
      - average_delivery_distance
      - average_delivery_fee
      - low_stock_count
      - orders_by_status
      - recent_orders
      - total_orders
      - total_simulated_sales
    DeliveryEstimateRequest:
      type: object
      properties:
        address:
          type: string
          maxLength: 500
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
    DeliveryEstimateResponse:
      type: object
      properties:
        origin_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        origin_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        destination_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        destination_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        estimated_duration_minutes:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,1})?$
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        delivery_zone:
          type: string
        geocoding_provider:
          type: string
        distance_provider:
          type: string
      required:
      - delivery_fee
      - delivery_zone
      - destination_latitude
      - destination_longitude
      - distance_km
      - distance_provider
      - estimated_duration_minutes
      - origin_latitude
      - origin_longitude
    GeocodeRequest:
      type: object
      properties:
        address:
          type: string
          maxLength: 500
      required:
      - address
    GeocodeResponse:
      type: object
      properties:
        original_address:
          type: string
        formatted_address:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
        provider:
          type: string
      required:
      - formatted_address
      - latitude
      - longitude
      - original_address
      - provider
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    InternalUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: Obligatorio. Longitud máxima 150 caracteres alfanuméricos.
            Letras, dígitos y @/./+/-/_ únicamente.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellido
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        state:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Activo
          description: Indica si el usuario debe ser tratado como un usuario activo.
