            application/json:
              schema:
                $ref: '#/components/schemas/InternalUser'
          description: ''
    put:
      operationId: accounts_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este usuario.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InternalUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InternalUser'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUser'
          description: ''
    patch:
      operationId: accounts_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este usuario.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInternalUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInternalUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInternalUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUser'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginToken'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginToken'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/cart/:
    get:
      operationId: cart_retrieve
      description: Devuelve el carrito activo del cliente autenticado.
      summary: Consultar carrito
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_destroy
      description: Elimina todos los productos del carrito del cliente.
      summary: Vaciar carrito
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cart/items/:
    get:
      operationId: cart_items_list
      description: Devuelve los productos agregados al carrito del cliente.
      summary: Listar productos del carrito
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCartItemList'
          description: ''
    post:
      operationId: cart_items_create
      description: Agrega un producto activo al carrito. Si el producto ya existe
        en el carrito, se incrementa la cantidad.
      summary: Agregar producto al carrito
      tags:
      - Carrito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
  /api/cart/items/{id}/:
    get:
      operationId: cart_items_retrieve
      description: Devuelve el detalle de un producto específico dentro del carrito.
      summary: Consultar producto del carrito
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
    put:
      operationId: cart_items_update
      description: Actualiza la cantidad de un producto dentro del carrito.
      summary: Actualizar cantidad del producto
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Carrito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemQuantity'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemQuantity'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemQuantity'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
    patch:
      operationId: cart_items_partial_update
      description: Actualiza la cantidad de un producto dentro del carrito.
      summary: Actualizar cantidad del producto parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Carrito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantity'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantity'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantity'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: Elimina un producto específico del carrito.
      summary: Eliminar producto del carrito
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Carrito
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
