<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6eee4" />
    <title>Daybed · Muebles para vivir mejor</title>
    <style>
      .daybed-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6eee4;
        color: #49372b;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .daybed-boot__card {
        width: min(420px, 100%);
        padding: 28px;
        border: 1px solid #dcc8b1;
        border-radius: 18px;
        background: #fffaf3;
        box-shadow: 0 18px 48px rgba(67, 46, 31, 0.1);
        text-align: center;
      }
      .daybed-boot__card strong { display: block; margin-bottom: 8px; font-size: 1.05rem; }
      .daybed-boot__card span { color: #786453; font-size: .86rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="daybed-boot" role="status" aria-live="polite">
        <section class="daybed-boot__card">
          <strong>Abriendo Daybed</strong>
          <span>La tienda se está preparando. Si el módulo principal falla, este mensaje seguirá visible en lugar de una pantalla en blanco.</span>
        </section>
      </main>
    </div>
    <noscript>Daybed necesita JavaScript para mostrar la tienda.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
