repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff check
        entry: powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-Location backend; uv run ruff check ."
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-black
        name: backend black check
        entry: powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-Location backend; uv run black --check ."
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
